<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to SEMS Portal</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* The sign-in box, v2 language (T-029, hand-off § 6): the card (--frame, 3 pt --rim ring, radius 14), a title in SF Pro,
   fields on the inset surface, Cancel secondary and Sign In primary. Every value from tokens.css. The window is transparent:
   the box's own corners are the window's. */
html,body{margin:0;padding:0;background:transparent}
*{box-sizing:border-box}
/* A column, as the approved pictures were drawn: margins don't collapse, so the error line keeps 6 pt above the buttons. */
.win{display:flex;flex-direction:column;width:320px;background:var(--frame);border-radius:var(--r-card);border:3px solid var(--rim);padding:var(--s6) var(--s5) var(--s5);color:var(--text);text-align:center;
  font:var(--t-body);-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
.appicon{width:56px;height:56px;margin:0 auto var(--s3);display:block}
h1{font:var(--t-title);margin:0 0 6px}
p{font:var(--t-label);color:var(--text-2);margin:0 0 var(--s4)}
label{display:block;text-align:left;margin:0 0 var(--s3)}
label span{display:block;font:var(--t-label);color:var(--text-2);margin:0 0 6px}
input{display:block;width:100%;height:32px;padding:0 10px;margin:0;background:var(--surface);color:var(--text);
  border:1px solid var(--edge);border-radius:var(--r-field);font:var(--t-body);outline:none;user-select:text}
input::placeholder{color:var(--text-2)}
input:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.err{color:var(--alert);font:var(--t-label);text-align:left;margin:-4px 0 6px;min-height:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s2)}
button{height:32px;border-radius:var(--r-ctl);border:0;background:var(--surface-3);color:var(--text);font:var(--t-body);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--hairline);outline:none;transition:scale var(--press) ease-out}
@media (prefers-reduced-motion:no-preference){ button:active{scale:.98} }
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.def{background:var(--primary);color:var(--on-primary);box-shadow:none}
.busy button.def{background:color-mix(in srgb,var(--primary) 60%,var(--frame))} /* dim the fill, not the label: 4.5:1 holds */
.spin{display:none;width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;
  vertical-align:-1px;margin-right:6px;animation:spin .8s linear infinite}
@keyframes spin{to{rotate:360deg}} @media (prefers-reduced-motion:reduce){.spin{animation:none;opacity:.6}}
.busy .spin{display:inline-block}
p.next{margin:var(--s4) calc(-1 * var(--s5)) 0;padding:var(--s3) var(--s5) 0;border-top:1px solid var(--hairline)}
</style>
</head>
<body>
<form class="win" id="box" aria-labelledby="t" novalidate>
  <img class="appicon" src="app-icon-128.png" alt="">
  <h1 id="t">Sign in to SEMS Portal</h1>
  <p>GoodWe Status reads your battery and grid from your SEMS Portal account (the one the SEMS+ app uses). Your email and password are saved in your Mac’s Keychain.</p>
  <label><span>Email</span><input id="email" type="email" placeholder="name@example.com" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <label><span>Password</span><input id="pw" type="password" placeholder="Required" autocomplete="current-password"></label>
  <div class="err" id="err" role="alert"></div>
  <div class="btns">
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" class="def" id="go"><span class="spin" aria-hidden="true"></span><span id="golbl">Sign In</span></button>
  </div>
  <p class="next" id="hint">Next, allow notifications so you hear when the grid goes off. Choose the Alerts style to keep them on screen.</p>
</form>
<script src="signin.js"></script>
</body>
</html>
