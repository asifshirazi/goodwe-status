<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to SEMS Portal</title>
<style>
/* The sign-in box (hand-off § 3). Tokens follow the system appearance. */
:root{
  --label:rgba(0,0,0,.85); --label-disabled:rgba(0,0,0,.25); --accent:#007AFF; --on-accent:#FFFFFF;
  --error-text:#D70015; --window:#ECECEC; --field:#FFFFFF; --field-edge:rgba(0,0,0,.15); --button:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --label:rgba(255,255,255,.85); --label-disabled:rgba(255,255,255,.25); --accent:#0A84FF;
    --error-text:#FF6961; --window:#2A2A2A; --field:rgba(255,255,255,.06); --field-edge:rgba(255,255,255,.14);
    --button:rgba(255,255,255,.14);
  }
}
html,body{margin:0;padding:0;background:transparent}
*{box-sizing:border-box}
.win{width:320px;background:var(--window);border-radius:16px;padding:20px;color:var(--label);text-align:center;
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  cursor:default;user-select:none}
.appicon{width:64px;height:64px;margin:0 auto 8px;display:block}
h1{font-size:13px;font-weight:700;margin:0 0 6px}
p{font-size:11px;line-height:1.4;margin:0 0 14px}
label{display:block;text-align:left;margin:0 0 8px}
label span{display:block;font-size:11px;margin:0 0 3px}
input{display:block;width:100%;height:24px;padding:0 7px;margin:0;background:var(--field);color:var(--label);
  border:1px solid var(--field-edge);border-radius:6px;font:inherit;font-size:13px;outline:none;user-select:text}
input::placeholder{color:var(--label-disabled)}
input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.err{color:var(--error-text);font-size:11px;text-align:left;margin:2px 0 6px;min-height:15px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{height:28px;border-radius:7px;border:0;background:var(--button);color:var(--label);font:inherit;font-size:13px;
  box-shadow:0 0 0 .5px var(--field-edge);outline:none}
button:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
button.def{background:var(--accent);color:var(--on-accent);box-shadow:none}
button.def:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.busy button.def{opacity:.55}
.spin{display:none;width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;
  vertical-align:-1px;margin-right:6px}
.busy .spin{display:inline-block}
p.next{margin:10px 0 0}
</style>
</head>
<body>
<form class="win" id="box" aria-labelledby="t" novalidate>
  <img class="appicon" src="app-icon-128.png" alt="">
  <h1 id="t">Sign in to SEMS Portal</h1>
  <p>GoodWe Status reads your battery and grid from your SEMS Portal account (the one the SEMS+ app uses). Your email and password are saved in your Mac’s Keychain.</p>
  <label><span>Email</span><input id="email" type="email" placeholder="name@example.com" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <label><span>Password</span><input id="pw" type="password" placeholder="Required" autocomplete="current-password"></label>
  <div class="err" id="err" role="alert"></div>
  <div class="btns">
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" class="def" id="go"><span class="spin" aria-hidden="true"></span><span id="golbl">Sign In</span></button>
  </div>
  <p class="next" id="hint">Next, allow notifications so you hear when the grid goes off. Choose the Alerts style to keep them on screen.</p>
</form>
<script src="signin.js"></script>
</body>
</html>
