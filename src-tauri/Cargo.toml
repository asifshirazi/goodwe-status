[package]
name = "goodwe-status"
version = "0.2.1"
description = "Menu bar battery % and grid on/off for GoodWe SEMS stations"
license = "MIT"
edition = "2021"

[lib]
name = "goodwe_status"
path = "src/lib.rs"

[[bin]]
name = "goodwe-status"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
hmac = "0.13.0"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2"

# Apple's UNUserNotificationCenter: real permission state and the default sound (5a item 5).
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
# T-029 Q2: NSColor.controlAccentColor for the pages (WKWebView's CSS AccentColor is always blue). Already in tauri's tree.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSColor", "NSColorSpace", "NSAppearance", "NSResponder", "NSWindow", "NSAnimation", "NSAnimationContext", "NSWorkspace", "NSAccessibility", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSGeometry"] }
# T-029 § 2: the Settings pane-switch resize curve (CAMediaTimingFunction). Already in tauri's tree.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMediaTimingFunction"] }
block2 = "0.6.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
